<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ورود به سیستم شوروم</title>
  <style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
    body { font-family: system-ui, -apple-system, sans-serif;
          background-color: #f3f4f6; display: flex; 
          justify-content: center; align-items: center;
          min-height: 100vh; margin: 0;
         padding: 16px; /* جلوگیری از چسبیدن به لبه‌های گوشی */
         }
    .login-box { background: white;
                padding: 28px 24px;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.08);
                width: 100%;
                max-width: 420px;        /* در تبلت و کامپیوتر از ۴۲۰ پیکسل بازتر نمی‌شود */
                margin: 0 auto;
               }
    .login-box h2{
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    h3 { margin-top: 0; text-align: center; color: #333; }
    .form-group {
        margin-bottom: 16px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 500;
    }   

    .form-control,
    input[type="text"],
    input[type="password"],
    input[type="number"] { 
      width: 100%;
      height: 48px;            /* ارتفاع استاندارد و لمس راحت با انگشت */
      padding: 10px 14px;
      font-size: 16px;         /* سایز ۱۶px مانع از زوم ناخواسته در آیفون (iOS) می‌شود */
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
    border-color: #2563eb;
}
    .captcha-box { 
      /* background: #eef2f7;
      padding: 10px; border-radius: 4px;
      text-align: center; margin-bottom: 15px;
      font-weight: bold; font-size: 15px;
      border: 1px dashed #b0bec5;  */
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .captcha-box input {
    text-align: center;
    }
    button { 
        width: 100%;
        height: 48px;
        background-color: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }
    button:hover { background: #0056b3; }
    .error { color: #d9534f; background: #fdf7f7; padding: 8px; border-radius: 4px; font-size: 13px; margin-bottom: 12px; border: 1px solid #ebccd1; }
  </style>
</head>
<body>

  <div class="login-box">
    <h3>ورود به سامانه</h3>
    
    {% if error %}
      <div class="error">{{error}}</div>
    {% endif %}

    <form method="post" action="/login">
      <!-- فیلد مخفی امن شامل جواب رمزنگاری‌شده -->
      <input type="hidden" name="captcha_token" value="{{ captcha_token }}">

    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">نام کاربری</label>
      <input name="username" required autocomplete="username" style="display: block; width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">رمز عبور</label>
      <input name="password" type="password" required autocomplete="current-password" style="display: block; width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
      
      <!-- بخش سوال امنیتی ریاضی -->
      <label>کد امنیتی (ضد ربات)</label>
      <div class="captcha-box" dir="ltr">
        {{num1}} + {{num2}} = ؟
      </div>
      <input name="captcha_answer" type="number" placeholder="حاصل جمع را وارد کنید" required autocomplete="off">

      <button type="submit">ورود</button>
    </form>
  </div>

</body>
</html>
